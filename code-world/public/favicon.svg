<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b14aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0f"/>
  
  <!-- Code brackets -->
  <path d="M10 8 L6 16 L10 24" stroke="url(#grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 8 L26 16 L22 24" stroke="url(#grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Slash -->
  <line x1="18" y1="8" x2="14" y2="24" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Glow effect -->
  <rect width="32" height="32" rx="4" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.5"/>
