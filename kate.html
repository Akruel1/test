<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вопрос 💗</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ffb6d9, #ff69b4);
    overflow: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Сердечки */
.heart {
    position: absolute;
    color: #ff1493;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
    }
}

h1 {
    color: white;
    font-size: 26px;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    gap: 20px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background-color: #ff1493;
    color: white;
}

#no {
    background-color: white;
    color: #ff1493;
}

.fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    font-size: 40px;
    border-radius: 0;
}
</style>
</head>

<body>

<h1 id="question">Отсосешь вечером? 💗</h1>

<div class="buttons">
    <button id="yes">Да</button>
    <button id="no">Нет</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");

let noScale = 1;
let yesScale = 1;

const noTexts = [
    "Ну пожалуйста 💔",
    "Не будь такой 😢",
    "Катя ну давай 💕",
    "Последний шанс 🥺"
];

let clickCount = 0;

noBtn.addEventListener("click", () => {
    if (clickCount < noTexts.length) {
        noBtn.textContent = noTexts[clickCount];
    }
    clickCount++;

    noScale -= 0.2;
    yesScale += 0.3;

    noBtn.style.transform = `scale(${noScale})`;
    yesBtn.style.transform = `scale(${yesScale})`;

    if (noScale <= 0.2) {
        noBtn.style.display = "none";
    }
});

yesBtn.addEventListener("click", () => {
    yesBtn.classList.add("fullscreen");
    yesBtn.textContent = "Урааа 💖 Люблю тебя!";
    question.style.display = "none";
    noBtn.style.display = "none";
});

/* Генерация сердечек */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
